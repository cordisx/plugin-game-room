<main class="game" aria-label="德州扑克牌桌">
  <div class="status">
    <strong id="status" role="status">等待游戏连接</strong><span class="note" id="blinds"></span>
  </div>
  <div class="seats" id="seats"></div>
  <div class="table">
    <strong id="pot">底池 0</strong><div class="cards" id="board" aria-label="公共牌"></div><span
      class="note"
      id="street"
    >等待发牌</span>
  </div>
  <div><span class="note">你的底牌</span><div class="cards" id="hole"></div></div>
  <div class="actions" id="actions" aria-label="可用动作"></div>
  <div class="note">单手无限注 · 超时自动过牌或弃牌 · 筹码总额守恒</div>
  <div class="error" id="error" role="alert"></div>
</main>
