services:
  game-room:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - game-room-data:/data
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ECONOMY_URL: ${ECONOMY_URL:-}
      ECONOMY_SERVICE_ID: ${ECONOMY_SERVICE_ID:-}
      ECONOMY_SERVICE_TOKEN: ${ECONOMY_SERVICE_TOKEN:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
volumes:
  game-room-data:
